name: offline-regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify supported Node runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - name: Run synthetic offline regression
        run: python3 -m unittest discover -s tests -p test_installer.py -v
      - name: Verify shared component drift
        run: python3 -m unittest discover -s tests -p test_shared_drift.py -v
